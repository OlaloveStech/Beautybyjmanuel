<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment | Beautybyjmanuel</title>
    <link rel="stylesheet" href="booking.css" />
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Beautybyjmanuel</div>
        <a href="index.html" class="nav-btn">Home</a>
    </nav>

    <!-- HEADER -->
    <section class="page-header">
        <h1>Book Your Appointment</h1>
        <p>Secure your beauty session in just a few clicks</p>
    </section>

    <!-- BOOKING FORM -->
    <section class="booking-container">
        <form class="booking-form">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Select Service</label>
                <select required>
                    <option value="">Choose a service</option>
                    <option>Makeup Session</option>
                    <option>Hair Styling</option>
                    <option>Lash Extensions</option>
                    <option>Skincare Treatment</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Select Date</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>Select Time</label>
                    <input type="time" required>
                </div>
            </div>

            <div class="form-group">
                <label>Additional Notes</label>
                <textarea rows="4" placeholder="Any special requests?"></textarea>
            </div>

            <button type="submit" class="btn-primary">
                Confirm Booking
            </button>

        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>Beautybyjmanuel | beautybyjmanuel@gmail.com</p>
    </footer>

</body>
</html>
